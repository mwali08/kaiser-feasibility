[project]
name = "vector-retrieval"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "flagembedding>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.53.0",
]
[dependency-groups]
dev = [
    "pytest",
]